version: "3.8"

services:
  postgres:
    image: postgres:14
    container_name: growtopia_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: growtopia
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
