<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Sandbox MMO — Authoritative Netcode Engine</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
</head>
<body>
  <!-- Authoritative Game Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Top-Left: Netcode Inspector & Physics Diagnostic Panel -->
  <div class="inspector-panel">
    <div class="panel-header">
      <div class="panel-title">
        <span class="live-badge"></span>
        <span>MMO Netcode Inspector</span>
      </div>
      <button id="btn-sound" class="btn-small">🔊 SFX On</button>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">RTT Latency</div>
        <div class="metric-value" id="stat-ping">0 ms</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Frame Rate</div>
        <div class="metric-value" id="stat-fps">60 FPS</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Reconciliations</div>
        <div class="metric-value" id="stat-recon">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Entities</div>
        <div class="metric-value" id="stat-entities">0</div>
      </div>
    </div>

    <!-- Artificial Network Condition Simulator -->
    <div class="simulator-controls">
      <div class="slider-group">
        <div class="slider-header">
          <span>Simulated Latency</span>
          <span id="val-lag" style="color: #60a5fa; font-family: monospace;">0ms</span>
        </div>
        <input type="range" id="slider-lag" min="0" max="400" step="10" value="0">
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <span>Simulated Packet Drop</span>
          <span id="val-drop" style="color: #f87171; font-family: monospace;">0%</span>
        </div>
        <input type="range" id="slider-drop" min="0" max="0.3" step="0.05" value="0">
      </div>

      <div class="toggles-row">
        <label class="checkbox-label">
          <input type="checkbox" id="chk-ghost">
          <span>Show Server Ghost Box</span>
        </label>
        <span id="stat-coords" style="font-family: monospace; color: #9ca3af;">X: 0, Y: 0</span>
      </div>
    </div>
  </div>

  <!-- Top-Right: Quick Keyboard & Mouse Control Guide -->
  <div class="guide-panel">
    <div style="font-weight: 700; color: #fff; margin-bottom: 6px;">🎮 Controls</div>
    <div><span class="key-pill">A</span> / <span class="key-pill">D</span> Move Horizontal</div>
    <div><span class="key-pill">W</span> / <span class="key-pill">Space</span> Jump</div>
    <div><span class="key-pill">L-Click</span> Mine Block / Hit</div>
    <div><span class="key-pill">R-Click</span> Place Block</div>
    <div><span class="key-pill">1-8</span> Select Block Material</div>
    <div><span class="key-pill">Enter</span> Open Chat</div>
  </div>

  <!-- Bottom-Center: Hotbar Block Selector -->
  <div class="hotbar-container">
    <div class="hotbar-slot active" data-slot="1">
      <span class="hotbar-number">1</span>
      <div class="tile-icon tile-1" title="Dirt"></div>
    </div>
    <div class="hotbar-slot" data-slot="2">
      <span class="hotbar-number">2</span>
      <div class="tile-icon tile-2" title="Stone"></div>
    </div>
    <div class="hotbar-slot" data-slot="3">
      <span class="hotbar-number">3</span>
      <div class="tile-icon tile-3" title="Wood"></div>
    </div>
    <div class="hotbar-slot" data-slot="4">
      <span class="hotbar-number">4</span>
      <div class="tile-icon tile-4" title="Brick"></div>
    </div>
    <div class="hotbar-slot" data-slot="5">
      <span class="hotbar-number">5</span>
      <div class="tile-icon tile-5" title="Glass"></div>
    </div>
    <div class="hotbar-slot" data-slot="6">
      <span class="hotbar-number">6</span>
      <div class="tile-icon tile-6" title="Gold"></div>
    </div>
    <div class="hotbar-slot" data-slot="7">
      <span class="hotbar-number">7</span>
      <div class="tile-icon tile-7" title="Lava"></div>
    </div>
    <div class="hotbar-slot" data-slot="8">
      <span class="hotbar-number">8</span>
      <div class="tile-icon tile-9" title="Bedrock"></div>
    </div>
  </div>

  <!-- Bottom-Left: Chat Input Box -->
  <div class="chat-container">
    <input type="text" id="chat-input" class="hidden" placeholder="Press Enter to send chat..." maxlength="80">
  </div>

  <!-- Client Engine Scripts -->
  <script src="js/renderer.js"></script>
  <script src="js/client_netcode.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
